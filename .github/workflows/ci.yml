name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  python-sidecar:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sidecar dependencies
        run: pip install -r python/requirements.txt

      - name: Check the sidecar parses and fails as documented
        # Exit code 2 is the "wrong arguments" path. This proves the script
        # parses and exits the way transcription.ts expects — the import of
        # faster-whisper happens after the argument check, so it is verified
        # separately below.
        #
        # The exit code has to be captured with `|| code=$?`: these steps run
        # under `bash -e`, which would otherwise abort the step on the very
        # non-zero exit this check exists to assert.
        run: |
          code=0
          python python/transcribe.py || code=$?
          test "$code" -eq 2

      - name: Check faster-whisper imports
        run: python -c "import faster_whisper; print('faster-whisper ok')"
