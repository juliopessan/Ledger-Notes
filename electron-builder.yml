appId: com.juliopessan.ledger-notes
productName: Ledger Notes
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
# ffmpeg is spawned as a process, so it cannot live inside the asar archive —
# a path running through app.asar fails with ENOTDIR. electron-builder's
# heuristics happen to unpack it today; this makes that guaranteed.
asarUnpack:
  - node_modules/ffmpeg-static/**
extraResources:
  - from: python
    to: python
    filter:
      - transcribe.py
      - requirements.txt
mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  target:
    - target: dmg
      arch: [arm64]
  # Built without a Developer ID: the app is neither signed nor notarised, so
  # Gatekeeper asks for an explicit "open anyway" on first launch. Signing
  # requires a paid Apple Developer Program account.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  # These two strings are what macOS shows in its own permission dialogs.
  extendInfo:
    NSMicrophoneUsageDescription: >-
      Ledger Notes needs the microphone to record your meetings.
    NSScreenCaptureDescription: >-
      Ledger Notes needs to capture system audio to record the other
      participants on the call.
