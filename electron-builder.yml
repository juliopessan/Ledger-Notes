appId: com.juliopessan.ledger-notes
productName: Ledger Notes
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: python
    to: python
    filter:
      - transcribe.py
      - requirements.txt
mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  target:
    - target: dmg
      arch: [arm64]
  # Build sem Developer ID: o app não é assinado nem notarizado, então o
  # Gatekeeper pede um "abrir mesmo assim" na primeira execução. Assinar exige
  # uma conta paga do Apple Developer Program.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: >-
      O Ledger Notes precisa acessar o microfone para gravar suas reuniões.
    NSScreenCaptureDescription: >-
      O Ledger Notes precisa capturar áudio do sistema para gravar os outros
      participantes da chamada.
